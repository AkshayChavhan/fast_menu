# Supabase CLI configuration for a local stack (`supabase start`). Used by CI
# for the end-to-end tests and handy for local development without touching
# the hosted project. Migrations in ./migrations are applied by `supabase db
# reset` / on first start; ./seed.sql needs a signed-up user, so it is not run
# automatically here.

project_id = "fast-menu"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = false

[studio]
enabled = false

[inbucket]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false

[realtime]
enabled = true

[analytics]
enabled = false
